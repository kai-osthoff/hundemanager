{# Farbschema "Türkis" (Standard) - Farben und Formen angelehnt an hsv-grossbottwar.de:
   Petrol, Türkis-Streifen, Anthrazit, eckige Kanten. Liegt über dem Grundstil in base.html
   (= "Grün (bisher)") und greift nur bei <html data-theme="tuerkis">. #}
<style>
    [data-theme="tuerkis"] * { border-radius: 0 !important; }  /* eckig, auch in Seiten-eigenen Stilen */
    [data-theme="tuerkis"] body {
        font-family: 'Poppins', 'Century Gothic', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        background-color: #F4F4F4;
        color: #212121;
    }
    [data-theme="tuerkis"] button,
    [data-theme="tuerkis"] input,
    [data-theme="tuerkis"] select,
    [data-theme="tuerkis"] textarea { font-family: inherit; }
    /* :where() hält die Spezifität so niedrig wie "a" im Grundstil - Knöpfe behalten ihre Farbe */
    :where([data-theme="tuerkis"]) a { color: #167E79; }
    :where([data-theme="tuerkis"]) a:hover { color: #0F5E5A; }
    [data-theme="tuerkis"] header { background: #1A928C; border-bottom: 8px solid #00CDCD; }
    [data-theme="tuerkis"] header h1,
    [data-theme="tuerkis"] .kennzahl strong,
    [data-theme="tuerkis"] .leiste h2,
    [data-theme="tuerkis"] .hund-name h4 { font-family: inherit; }
    [data-theme="tuerkis"] header h1 { font-weight: 700; letter-spacing: -0.01em; }
    [data-theme="tuerkis"] .update-kopf summary { color: #FFFFFF; }

    /* Knöpfe: weiß oder Umriss im Kopf, schwarz zum Speichern, Petrol-Umriss in Karten */
    [data-theme="tuerkis"] .btn-rund,
    [data-theme="tuerkis"] .btn { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.875rem; }
    [data-theme="tuerkis"] .btn-hell { background: #FFFFFF; color: #167E79; }
    [data-theme="tuerkis"] .btn-hell:hover { background: #E6F7F6; color: #0F5E5A; }
    [data-theme="tuerkis"] .btn-umriss { border: 1px solid #FFFFFF; color: #FFFFFF; font-weight: 700; }
    [data-theme="tuerkis"] .btn-umriss:hover { background: rgba(255, 255, 255, 0.12); color: #FFFFFF; }
    [data-theme="tuerkis"] .btn-primary { background: #212121; }
    [data-theme="tuerkis"] .btn-primary:hover { background: #000000; }
    [data-theme="tuerkis"] .knopf { border-color: #167E79; color: #167E79; font-weight: 600; }
    [data-theme="tuerkis"] .knopf:hover { background: #167E79; color: #FFFFFF; }
    [data-theme="tuerkis"] .knopf-gefahr { color: #B3261E; border-color: #D9A6A2; }
    [data-theme="tuerkis"] .knopf-gefahr:hover { background: #B3261E; border-color: #B3261E; color: #FFFFFF; }
    [data-theme="tuerkis"] .link-button { color: #167E79; }

    /* Kennzahl-Kacheln: weiß mit 4-px-Rahmen, Warnungen mit Streifen oben */
    [data-theme="tuerkis"] .kennzahl { background: #FFFFFF; color: #4E4B66; }
    [data-theme="tuerkis"] .kennzahl strong { color: #212121; font-weight: 700; }
    [data-theme="tuerkis"] a.kennzahl { border: 4px solid #FFFFFF; }
    [data-theme="tuerkis"] a.kennzahl:hover { border-color: #00CDCD; }
    [data-theme="tuerkis"] a.kennzahl[aria-current] { border-color: #212121; box-shadow: none; }
    [data-theme="tuerkis"] .kennzahl-warn { box-shadow: inset 0 6px 0 #E0A100; }
    [data-theme="tuerkis"] .kennzahl-warn strong { color: #7A4F00; }
    [data-theme="tuerkis"] .kennzahl-alarm { box-shadow: inset 0 6px 0 #C62828; }
    [data-theme="tuerkis"] .kennzahl-alarm strong { color: #B3261E; }
    [data-theme="tuerkis"] .filter-aus { color: #167E79; }

    [data-theme="tuerkis"] .leiste h2 { text-transform: uppercase; letter-spacing: 0.02em; }
    [data-theme="tuerkis"] .filter a { border: 2px solid #212121; color: #212121; font-weight: 600; }
    [data-theme="tuerkis"] .filter a:hover { background: #EBEBEB; }
    [data-theme="tuerkis"] .filter a[aria-current="page"] { background: #212121; color: #FFFFFF; }
    [data-theme="tuerkis"] .halter-kopf { padding-bottom: 12px; border-bottom: 4px solid #212121; }

    /* Etiketten und Status: Olivgrün und Braun aus der Vereinspalette, dazu Bernstein und Rot */
    [data-theme="tuerkis"] .etikett { background: #EEF3EA; color: #4F6B42; border: 1px solid currentColor; }
    [data-theme="tuerkis"] .etikett-grau { background: #F3EDEA; color: #6E4E45; }
    [data-theme="tuerkis"] .etikett-warn { background: #FFF6DB; color: #7A4F00; }
    [data-theme="tuerkis"] .etikett-alarm { background: #FCE4E2; color: #B3261E; }

    [data-theme="tuerkis"] .hund-karte { border: 1px solid #E2E2E2; box-shadow: inset 0 6px 0 #759465; padding-top: 28px; }
    [data-theme="tuerkis"] .hund-karte.status-bald { box-shadow: inset 0 6px 0 #E0A100; }
    [data-theme="tuerkis"] .hund-karte.status-abgelaufen { box-shadow: inset 0 6px 0 #C62828; }
    [data-theme="tuerkis"] .hund-karte.status-unvollstaendig { box-shadow: inset 0 6px 0 #846157; }
    [data-theme="tuerkis"] .avatar,
    [data-theme="tuerkis"] .status-bald .avatar,
    [data-theme="tuerkis"] .status-abgelaufen .avatar,
    [data-theme="tuerkis"] .status-unvollstaendig .avatar { background: #212121; color: #FFFFFF; font-weight: 700; }
    [data-theme="tuerkis"] .hund-name h4 { font-weight: 700; }
    [data-theme="tuerkis"] .gesamt { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
    [data-theme="tuerkis"] .gesamt-ok { background: #EEF3EA; color: #4F6B42; }
    [data-theme="tuerkis"] .gesamt-bald { background: #FFF6DB; color: #7A4F00; }
    [data-theme="tuerkis"] .gesamt-abgelaufen { background: #FCE4E2; color: #B3261E; }
    [data-theme="tuerkis"] .gesamt-unvollstaendig { background: #F3EDEA; color: #6E4E45; }
    [data-theme="tuerkis"] .impf { background: #F4F4F4; }
    [data-theme="tuerkis"] .impf dt { color: #4E4B66; }
    [data-theme="tuerkis"] .impf dd { color: #4F6B42; }
    [data-theme="tuerkis"] .impf-bald { background: #FFF6DB; }
    [data-theme="tuerkis"] .impf-bald dt, [data-theme="tuerkis"] .impf-bald dd { color: #7A4F00; }
    [data-theme="tuerkis"] .impf-abgelaufen { background: #FCE4E2; }
    [data-theme="tuerkis"] .impf-abgelaufen dt, [data-theme="tuerkis"] .impf-abgelaufen dd { color: #B3261E; }
    [data-theme="tuerkis"] .impf-keine-angabe dd { color: #6E4E45; }
    [data-theme="tuerkis"] .haft-zeile { background: #EEF3EA; color: #4F6B42; }
    [data-theme="tuerkis"] .haft-bald,
    [data-theme="tuerkis"] .haft-ohne-nachweis { background: #FFF6DB; color: #7A4F00; }
    [data-theme="tuerkis"] .haft-abgelaufen,
    [data-theme="tuerkis"] .haft-keine-angabe { background: #FCE4E2; color: #B3261E; }

    /* Flächen: weiß mit feiner Linie statt Schatten */
    [data-theme="tuerkis"] .table-container,
    [data-theme="tuerkis"] .form-container,
    [data-theme="tuerkis"] .legende { box-shadow: none; border: 1px solid #E2E2E2; }
    [data-theme="tuerkis"] .form-group input:focus,
    [data-theme="tuerkis"] .form-group select:focus,
    [data-theme="tuerkis"] .form-group textarea:focus { border-color: #167E79; box-shadow: 0 0 0 3px rgba(26, 146, 140, 0.2); }
    [data-theme="tuerkis"] .einstellungen-dialog { color: #212121; border-top: 8px solid #1A928C; }
    [data-theme="tuerkis"] .einstellungen-dialog::backdrop { background: rgba(33, 33, 33, 0.6); }
</style>
