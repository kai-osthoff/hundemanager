{# Update-Knopf oben rechts - auch einzeln unter /update/kopf, damit offene Seiten ihn nachladen #}
{% if update_info.verfuegbar %}
    <div class="update-kopf" data-stand="{{ update_info.version }}">
        <form action="{{ url_for('update_installieren') }}" method="POST"
              onsubmit="this.querySelector('button').disabled = true; this.querySelector('button').textContent = 'Update läuft …';">
            <button type="submit" class="btn-rund btn-hell">🎉 Neue Version {{ update_info.version }} installieren</button>
        </form>
        {% if update_info.notizen %}
            <details>
                <summary>Was ist neu?</summary>
                <pre>{{ update_info.notizen }}</pre>
            </details>
        {% endif %}
    </div>
{% else %}
    <form action="{{ url_for('update_pruefen') }}" method="POST" data-stand="aktuell">
        <button type="submit" class="btn-rund btn-umriss btn-symbol" title="Updates suchen" aria-label="Updates suchen">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 10-12h-7z"/></svg>
        </button>
    </form>
{% endif %}
